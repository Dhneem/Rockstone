[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rockstone"
version = "0.1.0"
description = "Image processing application for rock samples: slice alignment and beam-hardening removal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rockstone contributors" }]
keywords = ["micro-CT", "rock", "beam hardening", "registration", "computed tomography"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tifffile>=2023.1.23",
    "imageio>=2.28",
    "pydicom>=2.4",
    "pillow>=10.0",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pypdf>=4"]

[project.scripts]
rockstone = "rockstone.cli:main"

[tool.setuptools.packages.find]
include = ["rockstone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
